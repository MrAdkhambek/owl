# From the repository root:
#   docker compose -f examples/rest/docker-compose.yml up --build
# then the curl lines in README.md against localhost:8080.

services:
  redis:
    image: redis:7-alpine
    # Sessions and counters are ephemeral by design: no persistence.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  rest:
    build:
      context: ../..
      dockerfile: examples/rest/Dockerfile
    ports:
      - "8080:8080"
    environment:
      REST_ADDRESS: 0.0.0.0
      REST_PORT: "8080"
      REST_DB: /data/rest.db
      REST_REDIS: redis:6379
    volumes:
      - rest-data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  rest-data:

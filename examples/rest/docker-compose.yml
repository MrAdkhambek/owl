# From the repository root:
#   docker compose -f examples/rest/docker-compose.yml up --build
# then the curl lines in README.md against localhost:8080.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rest
      POSTGRES_PASSWORD: rest
      POSTGRES_DB: rest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rest -d rest"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # Sessions and counters are ephemeral by design: no persistence.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  rest:
    build:
      context: ../..
      dockerfile: examples/rest/Dockerfile
    ports:
      - "8080:8080"
    environment:
      REST_ADDRESS: 0.0.0.0
      REST_PORT: "8080"
      REST_PG: postgres://rest:rest@postgres:5432/rest
      REST_REDIS: redis:6379
    # Both are restarted under the monkey test's chaos phase, so the app
    # must survive losing either one; it reconnects on the next request.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg-data:
